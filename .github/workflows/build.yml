name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip -d "$HOME/gradle"
      - name: Remove hidden characters
        run: find src -name '*.java' -exec sed -i 's/\xe2\x80\x8b//g; s/^\xef\xbb\xbf//' {} +
      - name: Build
        run: '"$HOME/gradle/gradle-4.10.3/bin/gradle" build --no-daemon --stacktrace'
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MineRustRaidAddon
          path: build/libs/*.jar
